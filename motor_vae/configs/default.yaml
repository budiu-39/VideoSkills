# configs/default.yaml

# --- 实验基础设置 ---
exp_name: "8w_32d_512dim_amass_train_0005kl"
seed: 42
device: "cuda"
save_dir_root: "./vae_checkpoint"

# --- 数据路径 ---
# data_root: "dataset/272_rep_w_action/272_w_action"
data_root:  "dataset/272_rep/AMASS_sim"
test_data_root: "dataset/272_rep/AMASS_sim_test"

# --- 模型参数 ---
state_dim: 272
action_dim: 69
window_size: 8
hidden_dim: 512
latent_dim: 32
down_t: 2          # 下采样层数，之前硬编码在代码里的，现在提出来
norm_type: "BN"    # Normalization 类型

# --- 训练参数 ---
batch_size: 2048
num_epochs: 100
lr: 0.0002        # 5e-5
kl_anneal_steps: 5000

# --- Loss 设置 ---
state_recons_type: "optimal_gaussian" # 或者 "mse"
action_recons_type: "mse"
lambda_state: 1.0
lambda_action: 5.0
target_kl_weight: 0.005

# --- WandB ---
wandb_project: "VideoSkills-VAE"


save_interval: 5